<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget App Test</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body style="margin:0;background:#0f172a">
  <div id="root"><div style="color:#94a3b8;padding:24px;font-family:system-ui">Loading test...</div></div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="color:#f87171;padding:24px;font-family:monospace;font-size:14px;background:#1e293b;margin:16px;border-radius:8px;border:1px solid #ef4444">' +
        '<strong>ERROR on line ' + line + ':</strong><br/>' + msg + '</div>';
      return true;
    };
  </script>
  <script>
    const { useState } = React;
    function TestApp() {
      const [count, setCount] = React.useState(0);
      return React.createElement('div', {style:{color:'white',padding:20,background:'#1e293b',fontFamily:'system-ui',margin:16,borderRadius:8}},
        React.createElement('h1', null, 'Budget App — Connection Test'),
        React.createElement('p', null, 'React is working! Clicks: ' + count),
        React.createElement('button', {
          onClick: function(){ setCount(function(c){ return c+1; }); },
          style:{background:'#0ea5e9',color:'white',padding:'8px 16px',border:'none',borderRadius:8,cursor:'pointer',fontSize:16}
        }, 'Click to test'),
        React.createElement('p', {style:{color:'#10b981',marginTop:16}},
          '✓ CDN working — full app will load next')
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(TestApp));
  </script>
</body>
</html>
